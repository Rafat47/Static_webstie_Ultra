[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[build.environment]
  NODE_VERSION = "22"
  NODE_ENV = "production"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/data/website-data.json"]

[[redirects]]
  from = "/api/website-data"
  to = "/.netlify/functions/website-data"
  status = 200

[[redirects]]
  from = "/api/content"
  to = "/.netlify/functions/website-data"
  status = 200

[[redirects]]
  from = "/data/website-data.json"
  to = "/.netlify/functions/website-data"
  status = 200

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/orders/*"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/meta/events"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://connect.facebook.net https://www.facebook.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
